<style>
:root{--bg:#eceae6;--fg:#1c1c1e;--card:#fffffff0;--line:#00000022;--red:#d6001c;--chip:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--fg:#f2f2f2;--card:#202226f0;--line:#ffffff2a;--chip:#2a2c31}}
:root[data-theme="dark"]{--bg:#17181b;--fg:#f2f2f2;--card:#202226f0;--line:#ffffff2a;--chip:#2a2c31}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:400 15px/1.4 'Barlow Semi Condensed',system-ui,sans-serif}
canvas{display:block;touch-action:none}
#top{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--red);color:#fff;padding:6px 12px;border-radius:2px 14px 2px 14px;font-weight:700;font-size:16px}
#top small{font-weight:400;opacity:.85;margin-left:8px}
#card{position:absolute;left:12px;right:166px;bottom:62px;max-width:440px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:4px;padding:8px 14px}
#card h2{margin:0 0 2px;font-size:18px}#card p{margin:0;font-size:14px}
button{font:inherit;cursor:pointer;color:var(--fg)}
#chips{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;overflow-x:auto;padding:0 12px}
#chips button{flex:none;background:var(--chip);border:1px solid var(--line);border-radius:16px;padding:6px 13px}
#chips button.on{background:var(--red);color:#fff;border-color:var(--red)}
#cut{position:absolute;right:10px;top:calc(52px + env(safe-area-inset-top,0px));width:136px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px}
#cut h3{margin:0 0 6px;font-size:14px}
#tabs{display:flex;gap:4px}#tabs button{flex:1;padding:5px 0;background:var(--chip);border:1px solid var(--line);border-radius:3px;font-weight:700}
#fls{display:flex;flex-direction:column;gap:3px;margin:6px 0}
#fls button{background:var(--chip);border:1px solid var(--line);border-radius:3px;padding:4px 0}
#tabs button.on,#fls button.on{background:var(--red);color:#fff;border-color:var(--red)}
#lift{display:block;font-size:13px;margin-bottom:6px}
#ext{width:100%;background:none;border:1px solid var(--line);padding:5px;border-radius:3px}
#mode{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--chip);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-weight:600}
#slw{display:none;font-size:13px;margin:6px 0}#slw input{width:100%;margin:2px 0 0}
#cab{position:absolute;inset:0;background:#2b2d30;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#cab.on{display:flex}#cabn{font-size:110px;font-weight:700;line-height:1;color:#ff3347}
@media (max-height:640px){#fls button{padding:2px 0;font-size:13px}}

#intro{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}
#ipw,#ip{position:absolute;inset:0}

#icard b{display:block;font:400 clamp(26px,3.2vw,36px)/1 'Bebas Neue','Barlow Semi Condensed',sans-serif;color:#d6001c;letter-spacing:.6px}
#icard span{display:block;margin-top:8px;font-size:14px;color:#333}
#intro .lg{position:absolute;right:clamp(14px,2.6vw,40px);top:clamp(14px,2.7vw,30px);width:clamp(46px,5vw,66px);height:auto;filter:drop-shadow(0 2px 6px #0003);opacity:0}
#intro.go #icard,#intro.go .lg{opacity:1;transition:opacity .9s .7s}
#intro.go2 #icard,#intro.go2 .lg{opacity:0;transition:opacity .8s}

#top,#mode,#card,#chips,#cut{transition:opacity .9s}
body.pre #top,body.pre #mode,body.pre #card,body.pre #chips,body.pre #cut{opacity:0;pointer-events:none}

body.pre #ex{opacity:0;pointer-events:none}
#card{display:none}
#ex{position:absolute;right:0;top:calc(54px + env(safe-area-inset-top,0px));bottom:14px;width:min(280px,86vw);z-index:6;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .9s}
#ex.shut{transform:translateX(100%)}
#exh{position:absolute;left:-36px;top:50%;margin-top:-40px;width:36px;height:80px;padding:0;background:var(--red);border:0;border-radius:12px 0 0 12px;display:flex;align-items:center;justify-content:center;box-shadow:-3px 3px 12px #0003}
#exh svg{transition:transform .45s}#ex:not(.shut) #exh svg{transform:rotate(180deg)}
#ex.hint.shut #exh{animation:nudge 1.6s ease-in-out 4}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}
#exb{height:100%;overflow:auto;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-right:0;border-radius:6px 0 0 6px;padding:14px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#exb h3{margin:0;font:400 28px/1 'Bebas Neue','Barlow Semi Condensed',sans-serif;color:var(--red);letter-spacing:.6px}
#exb>p{margin:4px 0 12px;font-size:13px;opacity:.75}
.st{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:var(--chip);overflow:hidden}
.sh{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px;text-align:left;font-size:16px;font-weight:700}
.sh i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-size:13px;display:flex;align-items:center;justify-content:center}
.sh b{flex:1}
.sh u{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .25s;margin:0 4px 3px 0}
.st.open>.sh u{transform:rotate(-135deg);margin-bottom:-3px}
.sbd{display:none;padding:0 10px 10px}.st.open>.sbd{display:block}
.opt{display:flex;width:100%;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-top:6px;font-size:15px;text-align:left}
.opt small{opacity:.6;font-size:12px}
.opt.on,.fl button.on{background:var(--red);color:#fff;border-color:var(--red)}
.tw.act>.th{border-color:var(--red)}
.fl{display:none;padding:6px 0 0 10px;gap:4px;flex-direction:column}.tw.open>.fl{display:flex}
.fl button{background:var(--chip);border:1px solid var(--line);border-radius:3px;padding:5px 0}
#lift{margin:10px 0 2px}
#ext{width:100%;margin-top:4px;background:none;border:1px solid var(--line);padding:9px;border-radius:4px;font-weight:600}
